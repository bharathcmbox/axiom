# The initial organization: 7 logical agents, 2 developers (SPEC.md section 4).
# Seed with `make seed`. Developers: Claude Opus 5.5. Reviewers: Claude Fable 5.1, a different
# model from the developers (ADR-009). Phase 5 moves SEC-01 to Fable 5.2 and REV-01 to Sonnet 5.5.

[[agents]]
key = "EM-01"
role = "engineering_manager"
runtime = "claude_code"
model = "claude-opus-5-5"

[[agents]]
key = "ARCH-01"
role = "architect"
runtime = "claude_code"
model = "claude-opus-5-5"

[[agents]]
key = "DEV-01"
role = "developer"
runtime = "claude_code"
model = "claude-opus-5-5"

[[agents]]
key = "DEV-02"
role = "developer"
runtime = "claude_code"
model = "claude-opus-5-5"

[[agents]]
key = "QA-01"
role = "qa"
runtime = "claude_code"
model = "claude-opus-5-5"

[[agents]]
key = "SEC-01"
role = "security_reviewer"
runtime = "claude_code"
model = "claude-fable-5-1"

[[agents]]
key = "REV-01"
role = "code_reviewer"
runtime = "claude_code"
model = "claude-fable-5-1"

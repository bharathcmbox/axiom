# The initial organization: 7 logical agents, 2 developers (SPEC.md section 4).
# Seed with `make seed`. Developers: Claude Opus 5.5. Reviewers on models different from the
# developers' and from each other (ADR-009): code on Claude Fable 5.2, security on Claude Sonnet 5.5
# (the Phase 4 reviewer comparison: docs/runs/2026-11-07-reviewer-comparison.md).

[[agents]]
key = "EM-01"
role = "engineering_manager"
runtime = "claude_code"
model = "claude-opus-5-5"

[[agents]]
key = "ARCH-01"
role = "architect"
runtime = "claude_code"
model = "claude-opus-5-5"

[[agents]]
key = "DEV-01"
role = "developer"
runtime = "claude_code"
model = "claude-opus-5-5"

[[agents]]
key = "DEV-02"
role = "developer"
runtime = "claude_code"
model = "claude-opus-5-5"

[[agents]]
key = "QA-01"
role = "qa"
runtime = "claude_code"
model = "claude-opus-5-5"

[[agents]]
key = "SEC-01"
role = "security_reviewer"
runtime = "claude_code"
model = "claude-sonnet-5-5"

[[agents]]
key = "REV-01"
role = "code_reviewer"
runtime = "claude_code"
model = "claude-fable-5-2"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom
      POSTGRES_DB: axiom
    ports:
      - "127.0.0.1:${AXIOM_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    # default: for its published port. Workers aren't on either network, so they can't reach it.
    networks: [default, backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    environment:
      AXIOM_DATABASE_URL: postgresql://axiom:axiom@db:5432/axiom
      AXIOM_LEASE_SECONDS: ${AXIOM_LEASE_SECONDS:-300}
      AXIOM_REAPER_INTERVAL_SECONDS: ${AXIOM_REAPER_INTERVAL_SECONDS:-5}
    ports:
      - "127.0.0.1:${AXIOM_API_PORT:-8000}:8000"
    networks: [default, backend, workers]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  egress-proxy:
    build: docker/egress-proxy
    networks: [default, sandbox]
    restart: unless-stopped

  # The only holder of the Anthropic key (ADR-015). No LLM and no repository code run here. On both
  # networks: sandboxes reach it, and it reaches Anthropic. No published ports.
  model-proxy:
    build: .
    profiles: [workers]
    command: ["python", "-m", "axiom.modelproxy"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AXIOM_MODEL_PROXY_ADMIN_TOKEN: ${AXIOM_MODEL_PROXY_ADMIN_TOKEN:-}
    networks: [default, sandbox, workers]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The only holder of the Docker socket (ADR-016). Starts one fixed shape of container. The
  # workspaces directory is mounted at the same absolute path as on the host, because the Docker
  # daemon resolves the sandbox's bind mounts on the host.
  sandbox-launcher:
    build:
      context: .
      dockerfile: docker/launcher/Dockerfile
    profiles: [workers]
    user: "${AXIOM_UID:-1000}:${AXIOM_GID:-1000}"
    group_add: ["${DOCKER_GID:-999}"]
    environment:
      AXIOM_LAUNCHER_TOKEN: ${AXIOM_LAUNCHER_TOKEN:-}
      AXIOM_WORKSPACES_DIR: ${AXIOM_WORKSPACES_DIR:-/tmp/axiom-work}
      AXIOM_SANDBOX_NETWORK: ${AXIOM_SANDBOX_NETWORK:-axiom_sandbox}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AXIOM_WORKSPACES_DIR:-/tmp/axiom-work}:${AXIOM_WORKSPACES_DIR:-/tmp/axiom-work}
    networks: [workers]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The way out for workers and GitHub sync: GitHub only (ADR-017). Not the sandbox's proxy, whose
  # allowlist must not include GitHub.
  worker-egress-proxy:
    build:
      context: docker/egress-proxy
      args:
        ALLOWLIST: allowlist.workers
    profiles: [workers]
    networks: [default, workers]
    restart: unless-stopped

  # Workers (profile "workers"): `make workers`. One service per agent identity. No Docker socket:
  # they ask the launcher. The workspaces directory is at the same absolute path, as above.
  worker-dev-01: &worker
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    profiles: [workers]
    user: "${AXIOM_UID:-1000}:${AXIOM_GID:-1000}"
    environment: &worker-env
      AXIOM_API_URL: http://api:8000
      AXIOM_AGENT_KEY: DEV-01
      AXIOM_AGENT_TOKEN: ${AXIOM_DEV01_TOKEN:-}
      AXIOM_GITHUB_TOKEN: ${AXIOM_GITHUB_TOKEN:-}
      AXIOM_MODEL_PROXY_ADMIN_TOKEN: ${AXIOM_MODEL_PROXY_ADMIN_TOKEN:-}
      AXIOM_LAUNCHER_TOKEN: ${AXIOM_LAUNCHER_TOKEN:-}
      AXIOM_WORKSPACES_DIR: ${AXIOM_WORKSPACES_DIR:-/tmp/axiom-work}
      AXIOM_PROJECT_KEY: ${AXIOM_PROJECT_KEY:-}
      AXIOM_FAKE_SCENARIO: ${AXIOM_FAKE_SCENARIO:-}
      AXIOM_RUNTIME: ${AXIOM_RUNTIME:-sandbox}
      AXIOM_FAKE_EDITS_FILE: ${AXIOM_FAKE_EDITS_FILE:-}
      AXIOM_KEEP_WORKSPACES: ${AXIOM_KEEP_WORKSPACES:-0}
      AXIOM_DRILL_CANARY: ${AXIOM_DRILL_CANARY:-}
      HTTPS_PROXY: http://worker-egress-proxy:3128
      NO_PROXY: api,model-proxy,sandbox-launcher
    volumes:
      - ${AXIOM_WORKSPACES_DIR:-/tmp/axiom-work}:${AXIOM_WORKSPACES_DIR:-/tmp/axiom-work}
    networks: [workers]
    depends_on:
      api:
        condition: service_healthy
      egress-proxy:
        condition: service_started
      worker-egress-proxy:
        condition: service_started
      model-proxy:
        condition: service_healthy
      sandbox-launcher:
        condition: service_healthy
    restart: unless-stopped

  worker-dev-02:
    <<: *worker
    environment:
      <<: *worker-env
      AXIOM_AGENT_KEY: DEV-02
      AXIOM_AGENT_TOKEN: ${AXIOM_DEV02_TOKEN:-}

  # QA tasks are ordinary tasks with role qa: the same harness, and a plan keeps them to test paths.
  worker-qa-01:
    <<: *worker
    environment:
      <<: *worker-env
      AXIOM_AGENT_KEY: QA-01
      AXIOM_AGENT_TOKEN: ${AXIOM_QA01_TOKEN:-}

  # Reviewers (ADR-009): read-only review runs, on models other than the developers', one service per identity.
  reviewer-rev-01:
    <<: *worker
    environment:
      <<: *worker-env
      AXIOM_WORKER_KIND: review
      AXIOM_AGENT_KEY: REV-01
      AXIOM_AGENT_TOKEN: ${AXIOM_REV01_TOKEN:-}
      AXIOM_FAKE_REVIEW: ${AXIOM_FAKE_REVIEW:-}

  reviewer-sec-01:
    <<: *worker
    environment:
      <<: *worker-env
      AXIOM_WORKER_KIND: review
      AXIOM_AGENT_KEY: SEC-01
      AXIOM_AGENT_TOKEN: ${AXIOM_SEC01_TOKEN:-}
      AXIOM_FAKE_REVIEW: ${AXIOM_FAKE_REVIEW:-}

  # The planner (ADR-011): a read-only sandbox run that proposes tasks. Opus 5.5.
  planner-em-01:
    <<: *worker
    environment:
      <<: *worker-env
      AXIOM_WORKER_KIND: plan
      AXIOM_AGENT_KEY: EM-01
      AXIOM_AGENT_TOKEN: ${AXIOM_EM01_TOKEN:-}
      AXIOM_FAKE_PLAN: ${AXIOM_FAKE_PLAN:-}

  # GitHub sync (ADR-010, ADR-019): reads PR state, human change requests and CI; issues task
  # commands. Its only write to GitHub: fixed-text comments on the project's inbox issue. Control-plane code with its own DB connection (like the reaper).
  github-sync:
    build: .
    profiles: [workers]
    command: ["python", "-m", "axiom.sync.service"]
    environment:
      AXIOM_DATABASE_URL: postgresql://axiom:axiom@db:5432/axiom
      AXIOM_GITHUB_TOKEN: ${AXIOM_GITHUB_TOKEN:-}
      AXIOM_SYNC_GITHUB_TOKEN: ${AXIOM_SYNC_GITHUB_TOKEN:-}
      HTTPS_PROXY: http://worker-egress-proxy:3128
      NO_PROXY: db,api
      AXIOM_SYNC_INTERVAL_SECONDS: ${AXIOM_SYNC_INTERVAL_SECONDS:-30}
    healthcheck:
      disable: true
    networks: [backend, workers]
    depends_on:
      api:
        condition: service_healthy
      worker-egress-proxy:
        condition: service_started
    restart: unless-stopped

  # Built, never started by `up`: `docker compose --profile tools build sandbox`.
  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    image: axiom-sandbox:latest
    profiles: [tools]

networks:
  default:
  # Internal, like sandbox: workers and sync have no route out but their proxy (ADR-017).
  workers:
    internal: true
  # Only what needs the database: the API and GitHub sync.
  backend:
    internal: true
  # No route to the outside world: sandboxes reach the internet only via egress-proxy.
  sandbox:
    name: ${AXIOM_SANDBOX_NETWORK:-axiom_sandbox}
    internal: true

volumes:
  pgdata:

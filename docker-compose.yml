services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom
      POSTGRES_DB: axiom
    ports:
      - "127.0.0.1:${AXIOM_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    environment:
      AXIOM_DATABASE_URL: postgresql://axiom:axiom@db:5432/axiom
      AXIOM_LEASE_SECONDS: ${AXIOM_LEASE_SECONDS:-300}
      AXIOM_REAPER_INTERVAL_SECONDS: ${AXIOM_REAPER_INTERVAL_SECONDS:-5}
    ports:
      - "127.0.0.1:${AXIOM_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  egress-proxy:
    build: docker/egress-proxy
    networks: [default, sandbox]
    restart: unless-stopped

  # Built, never started by `up`: `docker compose --profile tools build sandbox`.
  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    image: axiom-sandbox:latest
    profiles: [tools]

networks:
  default:
  # No route to the outside world: sandboxes reach the internet only via egress-proxy.
  sandbox:
    name: ${AXIOM_SANDBOX_NETWORK:-axiom_sandbox}
    internal: true

volumes:
  pgdata:

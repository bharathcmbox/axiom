[project]
name = "axiom"
version = "0.1.0"
description = "An AI engineering organization: control plane for coding agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
sandbox = [
    "claude-agent-sdk>=0.2.177",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["docs"]  # docs hold illustrative, hand-aligned snippets

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
packages = ["axiom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not docker and not live'"
markers = [
    "docker: needs Docker and the axiom-sandbox / egress-proxy images (make test-docker)",
    "live: calls the real Anthropic API and costs money (make test-live, announced first)",
]

[dependency-groups]
dev = [
    "claude-agent-sdk>=0.2.177",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

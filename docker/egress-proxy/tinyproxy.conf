Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Info
# Only private-network clients (the sandbox network).
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
# Deny everything except hosts matching the allowlist (extended regex on the host name).
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
# HTTPS only (CONNECT to port 443).
ConnectPort 443
DisableViaHeader Yes
